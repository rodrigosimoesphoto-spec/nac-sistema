<script>

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
var DAYS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
var DAYS_FULL = ['Domingo','Segunda-feira','Terca-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sabado'];
var DEFAULT_CHK = {
  abertura: [
    {txt:'Conferir e-mails',dias:''},
    {txt:'Conferir Teams',dias:''},
    {txt:'Conferir WhatsApp',dias:''},
    {txt:'Conferir agenda do dia',dias:''},
    {txt:'Verificar ocorrencias',dias:''},
    {txt:'Conferir atividades NAC',dias:''},
    {txt:'Verificar pagamentos',dias:''},
    {txt:'Verificar matriculas',dias:''},
    {txt:'Conferir professores',dias:''},
    {txt:'Conferir materiais',dias:''}
  ],
  encerramento: [
    {txt:'Atividades concluidas registradas',dias:''},
    {txt:'Pendencias documentadas',dias:''},

    {txt:'Registros do dia salvos',dias:''},
    {txt:'Setor organizado',dias:''}
  ]
};

// Migrate old string format to new object format
function migrateChecks(chk) {
  ['abertura','encerramento'].forEach(function(sec){
    if(!chk[sec]) return;
    chk[sec] = chk[sec].map(function(item){
      if(typeof item === 'string') return {txt:item,dias:''};
      return item;
    });
  });
  return chk;
}

var tasks = [], mels = [], checkState = {}, logs = [];
var checks = migrateChecks(JSON.parse(localStorage.getItem('nac_chk_v4') || JSON.stringify(DEFAULT_CHK)));
var tab = 'dashboard', wkOff = 0, rtOff = 0, syncOk = true;
var iaHist = [{r:'bot',t:'Ola! Sou o assistente do NAC. Estou conectado ao banco em tempo real. O que precisa?'}];
var iaBusy = false, briefing = '', briefingLoading = false;
var dragId = null, dragDate = null;

function saveChecks() { localStorage.setItem('nac_chk_v4', JSON.stringify(checks)); }

function itemVisibleOnDay(item, ds) {
  // If dias is empty, visible every day
  if(!item.dias) return true;
  var dow = String(new Date(ds+'T12:00:00').getDay());
  return item.dias.split(',').indexOf(dow) >= 0;
}

// ══════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function today() { return new Date().toISOString().slice(0,10); }
function fmtD(s) { if(!s) return '-'; var p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtDL(s) { if(!s) return ''; return new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pdotColor(p) { return {Alta:'#D62828',Media:'#B86000',Baixa:'#1A7A4A'}[p]||'#9CA3AF'; }
function badgeCls(s) {
  var m = {'Nao iniciado':'b-gray','Em andamento':'b-blue','Aguardando':'b-amber','Concluido':'b-green',
    Alta:'b-red',Media:'b-amber',Baixa:'b-green',Identificado:'b-gray','Em analise':'b-blue',
    'Em execucao':'b-amber',Descartado:'b-gray'};
  return m[s]||'b-gray';
}

function wkDates(off) {
  var n=new Date(), day=n.getDay(), m=new Date(n);
  m.setDate(n.getDate()-day+1+(off||0)*7);
  var r=[];
  for(var i=0;i<5;i++){var d=new Date(m);d.setDate(m.getDate()+i);r.push(d);}
  return r;
}

function getTasksForDate(ds) {
  var regular = tasks.filter(function(t){return t.data===ds;});
  var dow = String(new Date(ds+'T12:00:00').getDay());
  var recurring = tasks.filter(function(t){
    if(!t.recorrente||!t.dias_semana) return false;
    if(t.data===ds) return false; // already in regular
    return t.dias_semana.split(',').indexOf(dow)>=0;
  }).map(function(t){ return Object.assign({},t,{data:ds,_virtual:true}); });
  return regular.concat(recurring).sort(function(a,b){return (a.hora||'')>(b.hora||'')?1:-1;});
}

// ══════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════
var toastT = null;
function toast(msg,type) {
  var el = document.getElementById('the-toast');
  el.textContent = msg;
  el.style.background = type==='ok'?'#1A7A4A':type==='err'?'#D62828':'#002B7F';
  el.style.display = 'block';
  if(toastT) clearTimeout(toastT);
  toastT = setTimeout(function(){el.style.display='none';}, 2500);
}

// ══════════════════════════════════════════
// DOM HELPERS
// ══════════════════════════════════════════
function el(tag,cls,style,text) {
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(style) e.setAttribute('style',style);
  if(text!==undefined) e.textContent = text;
  return e;
}
function div(cls,style) { return el('div',cls,style); }
function span(cls,text) { return el('span',cls,'',text); }
function btn(cls,text,onclick) {
  var b = el('button',cls,'',text);
  if(onclick) b.onclick = onclick;
  return b;
}

function mk_fg(label,input) {
  var d=div('fg'); var l=el('label','flbl','',label); d.appendChild(l); d.appendChild(input); return d;
}
function mk_row() { return div('frow'); }
function mk_row3() { return div('frow3'); }
function mk_inp(id,val,ph,type) {
  var e=el('input','finp'); e.id=id; e.type=type||'text'; e.value=val||''; e.placeholder=ph||''; return e;
}
function mk_sel(id,opts,val) {
  var e=el('select','fsel'); e.id=id;
  opts.forEach(function(o){var op=document.createElement('option');op.value=o;op.textContent=o;if(o===val)op.selected=true;e.appendChild(op);});
  return e;
}
function mk_txt(id,val,ph) {
  var e=el('textarea','ftxt'); e.id=id; e.value=val||''; e.placeholder=ph||''; e.rows=3; return e;
}
function mk_btn(label,bg,color,ghost) {
  var b=el('button','btn','',label);
  b.style.background=bg; b.style.color=color;
  if(ghost) b.style.border='1.5px solid #D4D9ED';
  return b;
}
function gv(id) { return (document.getElementById(id)||{}).value||''; }

function mk_badge(text,cls) { return span('badge '+(cls||'b-gray'),text); }
function mk_pdot(color) { var d=div('pdot'); d.style.background=color; return d; }

// MODAL
// ══════════════════════════════════════════
var mType=null, mData=null;

function modalOpen(type,data) {
  mType=type; mData=data;
  var formEl=document.getElementById('modal-form');
  var footEl=document.getElementById('modal-foot');
  var titleEl=document.getElementById('modal-title-el');
  formEl.innerHTML=''; footEl.innerHTML='';

  if(type==='task') {

    // Title

    formEl.appendChild(mk_fg('Descricao',mk_txt('pm-d',t.descricao)));

    // Date + Time
    var r1=mk_row();
    r1.appendChild(mk_fg('Data',mk_inp('pm-data',t.data||data.date||'','','date')));
    r1.appendChild(mk_fg('Horario',mk_inp('pm-hr',t.hora,'','time')));

    // Responsavel + Destinatario

    r2.appendChild(mk_fg('Responsavel',mk_sel('pm-resp',['Coordenador','Assistente','Ambos'],t.responsavel||'Coordenador')));
    r2.appendChild(mk_fg('Destinatario',mk_inp('pm-dest',t.destinatario,'Para quem e?')));
    formEl.appendChild(r2);

    // Priority + Status
    var r3=mk_row();
    r3.appendChild(mk_fg('Prioridade',mk_sel('pm-prio',['Alta','Media','Baixa'],t.prioridade||'Media')));
    r3.appendChild(mk_fg('Status',mk_sel('pm-status',['Nao iniciado','Em andamento','Aguardando','Concluido'],t.status||'Nao iniciado')));
    formEl.appendChild(r3);

    // Category
    formEl.appendChild(mk_fg('Categoria',mk_inp('pm-cat',t.categoria,'Ex: Administrativo')));

    // Recurring days

    recFg.appendChild(el('label','flbl','','Repetir nos dias da semana'));
    var diasRow=div('','display:flex;gap:8px;flex-wrap:wrap;margin-top:4px');
    var diasAtivos=t.dias_semana?t.dias_semana.split(','):[];
    ['Seg','Ter','Qua','Qui','Sex'].forEach(function(nome,i){
      var val=String(i+1);
      var b=el('button','day-pill'+(diasAtivos.indexOf(val)>=0?' on':''),'',nome);
      b.dataset.dia=val;
      b.type='button';
      b.onclick=function(){this.classList.toggle('on');};
      diasRow.appendChild(b);
    });
    recFg.appendChild(diasRow);
    formEl.appendChild(recFg);

    // Observacoes
    formEl.appendChild(mk_fg('Observacoes',mk_txt('pm-obs',t.observacoes)));

    // Concluded by
    if(t.status==='Concluido'||t.concluido_por) {
      var r4=mk_row();
      r4.appendChild(mk_fg('Concluido por',mk_inp('pm-cby',t.concluido_por)));
      r4.appendChild(mk_fg('Data conclusao',mk_inp('pm-cdt',t.concluido_em?t.concluido_em.slice(0,10):'','','date')));
      formEl.appendChild(r4);
    }

    // Footer
    var cancelBtn=mk_btn('Cancelar','transparent','#4B5563',true);
    cancelBtn.onclick=modalClose;
    footEl.appendChild(cancelBtn);
    if(t.id) {
      var delBtn=mk_btn('Excluir','#FDEAEA','#D62828');
      delBtn.onclick=function(){doDelTask(t.id);};
      footEl.appendChild(delBtn);
    }
    var saveBtn=mk_btn('Salvar','#002B7F','#fff');
    saveBtn.onclick=submitTask;
    footEl.appendChild(saveBtn);
  }

  else if(type==='mel') {
    var m=data.mel||{};
    titleEl.textContent=m.id?'Editar Melhoria':'Nova Melhoria';

    formEl.appendChild(mk_fg('Problema identificado',mk_txt('pm-prob',m.problema)));
    formEl.appendChild(mk_fg('Sugestao de melhoria',mk_txt('pm-sug',m.sugestao)));

    var r1=mk_row();
    r1.appendChild(mk_fg('Prioridade',mk_sel('pm-prio',['Alta','Media','Baixa'],m.prioridade||'Media')));
    r1.appendChild(mk_fg('Impacto',mk_sel('pm-imp',['Alto','Medio','Baixo'],m.impacto||'Medio')));
    formEl.appendChild(r1);

    var r2=mk_row();
    r2.appendChild(mk_fg('Responsavel',mk_sel('pm-resp',['Coordenador','Assistente','Equipe'],m.responsavel||'Coordenador')));
    r2.appendChild(mk_fg('Setor encaminhado',mk_inp('pm-setor',m.setor,'Ex: Manutencao, TI...')));
    formEl.appendChild(r2);

    var r3=mk_row();
    r3.appendChild(mk_fg('Prazo',mk_inp('pm-prazo',m.prazo,'','date')));
    r3.appendChild(mk_fg('Status',mk_sel('pm-status',['Identificado','Em analise','Em execucao','Concluido','Descartado'],m.status||'Identificado')));
    formEl.appendChild(r3);

    var cancelBtn=mk_btn('Cancelar','transparent','#4B5563',true);
    cancelBtn.onclick=modalClose;
    footEl.appendChild(cancelBtn);
    if(m.id){var db2=mk_btn('Excluir','#FDEAEA','#D62828');db2.onclick=function(){doDelMel(m.id);};footEl.appendChild(db2);}
    var saveBtn=mk_btn('Salvar','#002B7F','#fff');saveBtn.onclick=submitMel;
    footEl.appendChild(saveBtn);
  }

  else if(type==='log') {
    var day=data.day;
    titleEl.textContent='Registrar - '+fmtD(day);
    formEl.appendChild(mk_fg('Tipo',mk_sel('pm-log-tipo',['ocorrencia','decisao','reuniao','ideia','observacao'],'ocorrencia')));
    formEl.appendChild(mk_fg('Descricao',mk_txt('pm-log-txt','')));
    var cancelBtn=mk_btn('Cancelar','transparent','#4B5563',true);cancelBtn.onclick=modalClose;footEl.appendChild(cancelBtn);
    var saveBtn=mk_btn('Registrar','#002B7F','#fff');saveBtn.onclick=function(){submitLog(day);};footEl.appendChild(saveBtn);
  }

  else if(type==='addchk') {
    var sec=data.sec;
    var editIdx=data.editIdx;
    var existing=editIdx!==undefined?checks[sec][editIdx]:null;
    titleEl.textContent=existing?'Editar item':'Adicionar item - '+(sec==='abertura'?'Abertura':'Encerramento');
    formEl.appendChild(mk_fg('Nome do item',mk_inp('pm-chk-txt',existing?existing.txt:'','Ex: Verificar escala...')));

    // Days selector
    var diasFg=div('fg');
    var diasLbl=el('label','flbl','','Aparece em quais dias?');diasFg.appendChild(diasLbl);
    var diasHint=div('','font-size:11px;color:#9CA3AF;margin-bottom:6px');diasHint.textContent='Deixe em branco para todos os dias';diasFg.appendChild(diasHint);
    var diasRow2=div('','display:flex;gap:8px;flex-wrap:wrap');
    var existingDias=existing&&existing.dias?existing.dias.split(','):[];
    ['Seg','Ter','Qua','Qui','Sex'].forEach(function(nome,i){
      var val=String(i+1);
      var b=el('button','day-pill'+(existingDias.indexOf(val)>=0?' on':''),'',nome);
      b.dataset.dia=val;b.type='button';
      b.onclick=function(){this.classList.toggle('on');};
      diasRow2.appendChild(b);
    });
    diasFg.appendChild(diasRow2);
    formEl.appendChild(diasFg);

    var cancelBtn=mk_btn('Cancelar','transparent','#4B5563',true);cancelBtn.onclick=modalClose;footEl.appendChild(cancelBtn);
    if(existing&&editIdx!==undefined) {
      var delBtn=mk_btn('Remover','#FDEAEA','#D62828');
      delBtn.onclick=function(){removeChkItem(sec,editIdx);};
      footEl.appendChild(delBtn);
    }
    var saveBtn=mk_btn(existing?'Salvar':'Adicionar','#002B7F','#fff');
    saveBtn.onclick=function(){submitChk(sec,editIdx);};footEl.appendChild(saveBtn);
  }

  document.getElementById('the-modal').classList.add('open');
  setTimeout(function(){var f=formEl.querySelector('input,textarea');if(f&&type!=='log')f.focus();},150);
}

function modalClose() {
  document.getElementById('the-modal').classList.remove('open');
  mType=null; mData=null;
}

// ══════════════════════════════════════════
// SUBMIT
// ══════════════════════════════════════════
function submitTask() {
  var titulo=gv('pm-t');
  if(!titulo.trim()){toast('Informe o titulo','err');return;}
  var id=mData&&mData.task?mData.task.id:null;
  var statusVal=gv('pm-status')||'Nao iniciado';
  // Get selected days
  var diasSel=[];
  document.querySelectorAll('.day-pill.on').forEach(function(b){diasSel.push(b.dataset.dia);});
  var item={
    id:id||uid(), titulo:titulo, descricao:gv('pm-d'),
    data:gv('pm-data'), hora:gv('pm-hr'),
    responsavel:gv('pm-resp')||'Coordenador', destinatario:gv('pm-dest'),
    prioridade:gv('pm-prio')||'Media', status:statusVal,
    categoria:gv('pm-cat'), observacoes:gv('pm-obs'),
    dias_semana:diasSel.join(','), recorrente:diasSel.length>0,
    criado_por:id&&mData.task.criado_por?mData.task.criado_por:'Coordenador',
    criado_em:id&&mData.task.criado_em?mData.task.criado_em:new Date().toISOString()
  };
  if(statusVal==='Concluido') {
    item.concluido_por=gv('pm-cby')||'Coordenador';
    var cdt=gv('pm-cdt');
    item.concluido_em=cdt?(cdt+'T00:00'):new Date().toISOString();
  }
  var p=id?db.patch('tarefas',id,item):db.post('tarefas',item);
  p.then(function(){return loadAll();}).then(function(){modalClose();toast('Tarefa salva!','ok');}).catch(function(){toast('Erro ao salvar','err');});
}

function doDelTask(id) {
  if(!confirm('Excluir esta tarefa?'))return;
  db.del('tarefas',id).then(function(){return loadAll();}).then(function(){modalClose();toast('Excluida.');}).catch(function(){toast('Erro','err');});
}

function submitMel() {
  var problema=gv('pm-prob');
  if(!problema.trim()){toast('Descreva o problema','err');return;}
  var id=mData&&mData.mel?mData.mel.id:null;
  var item={id:id||uid(),problema:problema,sugestao:gv('pm-sug'),prioridade:gv('pm-prio')||'Media',impacto:gv('pm-imp')||'Medio',responsavel:gv('pm-resp')||'Coordenador',setor:gv('pm-setor'),prazo:gv('pm-prazo'),status:gv('pm-status')||'Identificado'};
  var p=id?db.patch('melhorias',id,item):db.post('melhorias',item);
  p.then(function(){return loadAll();}).then(function(){modalClose();toast('Melhoria salva!','ok');}).catch(function(){toast('Erro','err');});
}

function doDelMel(id) {
  if(!confirm('Excluir?'))return;
  db.del('melhorias',id).then(function(){return loadAll();}).then(function(){modalClose();toast('Excluida.');}).catch(function(){toast('Erro','err');});
}

function submitLog(day) {
  var tipo=gv('pm-log-tipo')||'ocorrencia';
  var texto=gv('pm-log-txt');
  if(!texto.trim()){toast('Descreva o registro','err');return;}
  var hora=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  db.post('logs',{id:uid(),data:day,tipo:tipo,texto:texto,hora:hora})
    .then(function(){return loadAll();}).then(function(){modalClose();toast('Registrado!','ok');}).catch(function(){toast('Erro','err');});
}

function submitChk(sec,editIdx) {
  var t=gv('pm-chk-txt');
  if(!t.trim()){toast('Digite o nome do item','err');return;}
  var diasSel=[];
  document.querySelectorAll('#modal-form .day-pill.on').forEach(function(b){diasSel.push(b.dataset.dia);});
  var item={txt:t.trim(),dias:diasSel.join(',')};
  if(editIdx!==undefined){
    checks[sec][editIdx]=item;
    toast('Item atualizado!','ok');
  } else {
    checks[sec]=(checks[sec]||[]).concat([item]);
    toast('Item adicionado!','ok');
  }
  saveChecks();modalClose();renderPage();
}

// ══════════════════════════════════════════
// CHECKLIST OPS
// ══════════════════════════════════════════
function toggleCheck(day,sec,idx) {
  if(!checkState[day])checkState[day]={};
  if(!checkState[day][sec])checkState[day][sec]={};
  var v=!checkState[day][sec][idx];
  checkState[day][sec][idx]=v;
  renderPage();
  db.ups('checklist_state',{id:day+'_'+sec+'_'+idx,data:day,secao:sec,indice:idx,concluido:v}).catch(function(){});
}

function setStars(day,n) {
  if(!checkState[day])checkState[day]={};
  checkState[day]._stars=n;
  renderPage();
  db.ups('checklist_state',{id:day+'_stars_0',data:day,secao:'stars',indice:n,concluido:true}).catch(function(){});
  toast('Produtividade: '+n+'/5','ok');
}

function removeChkItem(sec,idx) {
  if(!confirm('Remover este item de todos os dias?'))return;
  checks[sec].splice(idx,1);saveChecks();modalClose();renderPage();
}

function moveChkItem(sec,idx,dir) {
  var arr=checks[sec],ni=idx+dir;
  if(ni<0||ni>=arr.length)return;
  var tmp=arr[idx];arr[idx]=arr[ni];arr[ni]=tmp;
  saveChecks();renderPage();
}

// Also update dashboard checklist preview to use new format
function getChkItemText(item) {
  return typeof item==='string'?item:(item.txt||'');
}

// ══════════════════════════════════════════
// DRAG & DROP
// ══════════════════════════════════════════
function onDragStart(e,id,date) {
  dragId=id; dragDate=date;
  e.dataTransfer.effectAllowed='move';
  setTimeout(function(){e.target.style.opacity='0.5';},0);
}
function onDragEnd(e) { e.target.style.opacity='1'; }
function onDragOver(e) { e.preventDefault(); }
function onDrop(e,newDate) {
  e.preventDefault();
  if(!dragId||dragDate===newDate)return;
  db.patch('tarefas',dragId,{data:newDate}).then(function(){
    tasks=tasks.map(function(t){return t.id===dragId?Object.assign({},t,{data:newDate}):t;});
    dragId=null;dragDate=null;renderPage();toast('Tarefa movida!','ok');
  }).catch(function(){toast('Erro ao mover','err');});
}

// ══════════════════════════════════════════
// DATA LOAD
// ══════════════════════════════════════════
function loadAll() {
  return Promise.all([
    db.get('tarefas','order=criado_em.desc'),
    db.get('melhorias','order=criado_em.desc'),
    db.get('checklist_state'),
    db.get('logs','order=criado_em.desc&limit=200')
  ]).then(function(r){
    tasks=r[0]||[]; mels=r[1]||[]; logs=r[3]||[];
    checkState={};
    (r[2]||[]).forEach(function(x){
      if(!checkState[x.data])checkState[x.data]={};
      if(x.secao==='stars')checkState[x.data]._stars=x.indice;
      else{if(!checkState[x.data][x.secao])checkState[x.data][x.secao]={};checkState[x.data][x.secao][x.indice]=x.concluido;}
    });
    syncOk=true;
    if(!document.getElementById('the-modal').classList.contains('open'))renderPage();
  }).catch(function(){syncOk=false;});
}

// ══════════════════════════════════════════
// AI
// ══════════════════════════════════════════
function buildCtx() {
  var td=today();
  var tj=getTasksForDate(td);
  var at=tasks.filter(function(t){return t.data&&t.data<td&&t.status!=='Concluido';});
  var lh=logs.filter(function(l){return l.data===td;});
  var ab=checks.abertura||[];
  var cs=checkState[td]||{};
  var abD=ab.filter(function(_,i){return(cs.abertura||{})[i];}).length;
  var ma=mels.filter(function(m){return m.status!=='Concluido'&&m.status!=='Descartado';});
  return 'DATA:'+fmtDL(td)+
    '\nTAREFAS HOJE('+tj.length+'):'+tj.map(function(t){return '['+t.status+']'+t.titulo+'|'+t.responsavel;}).join('/')||'Nenhuma'+
    '\nATRASADAS('+at.length+'):'+at.map(function(t){return fmtD(t.data)+' '+t.titulo;}).join('/')||'Nenhuma'+
    '\nCHECKLIST:'+abD+'/'+ab.length+
    '\nLOGS('+lh.length+'):'+lh.map(function(l){return '['+l.tipo+']'+l.texto.slice(0,40);}).join('/')||'Nenhum'+
    '\nMELHORIAS('+ma.length+'):'+ma.slice(0,4).map(function(m){return '['+m.prioridade+']'+(m.problema||'').slice(0,40);}).join('/')||'Nenhuma';
}

function callAI(sys,msg) {
  return fetch(EDGE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY},
    body:JSON.stringify({system:sys,messages:[{role:'user',content:msg}]})})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(d){return (d.content||[]).map(function(c){return c.text||'';}).join('');});
}

function callAIConv(sys,history) {
  return fetch(EDGE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY},
    body:JSON.stringify({system:sys,messages:history})})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(d){return (d.content||[]).map(function(c){return c.text||'';}).join('');});
}

function genBriefing() {
  briefingLoading=true;briefing='';renderPage();
  callAI('Voce e o assistente do NAC Marista. Direto, sem formalidade.\n\n'+buildCtx(),
    'Briefing direto do dia: prioridades, riscos, recomendacoes. Bullets. Max 200 palavras.')
    .then(function(r){briefing=r;briefingLoading=false;renderPage();})
    .catch(function(){briefing='Erro ao conectar.';briefingLoading=false;renderPage();});
}

function sendIA(msg) {
  if(!msg||!msg.trim()||iaBusy)return;
  iaBusy=true;
  iaHist.push({r:'user',t:msg.trim()});
  var inp=document.getElementById('ai-inp-el');
  if(inp){inp.value='';inp.style.height='auto';}
  updateIAMsgs();
  var history=iaHist.slice(-8).map(function(m){return{role:m.r==='user'?'user':'assistant',content:m.t};});
  callAIConv('Voce e o assistente do NAC Marista. Direto, sem formalidade.\n\n'+buildCtx(),history)
    .then(function(r){iaHist.push({r:'bot',t:r});iaBusy=false;updateIAMsgs();})
    .catch(function(e){iaHist.push({r:'bot',t:'Erro: '+e.message});iaBusy=false;updateIAMsgs();});
}

function updateIAMsgs() {
  var el2=document.getElementById('ia-msgs-el');
  if(!el2)return;
  while(el2.firstChild)el2.removeChild(el2.firstChild);
  iaHist.forEach(function(m){
    var d=div('ai-msg '+(m.r==='user'?'user':'bot'));
    d.innerHTML=esc(m.t).replace(/\n/g,'<br>');
    el2.appendChild(d);
  });
  if(iaBusy){var th=div('ai-msg thinking','');th.textContent='Analisando...';el2.appendChild(th);}
  el2.scrollTop=el2.scrollHeight;
  var sb=document.querySelector('.ai-send');
  if(sb)sb.disabled=iaBusy;
}

// ══════════════════════════════════════════
// PAGE BUILDERS (using DOM, no string concat)
// ══════════════════════════════════════════
function mkTaskItem(t,showDate) {
  var d=div('task-item'+(t.status==='Concluido'?' done':''));
  d.draggable=true;
  d.ondragstart=function(e){onDragStart(e,t.id,t.data);};
  d.ondragend=onDragEnd;
  d.onclick=function(){
    var found=tasks.find(function(x){return x.id===t.id;});
    modalOpen('task',{task:found||t});
  };

  var dot=mk_pdot(pdotColor(t.prioridade));
  d.appendChild(dot);

  var info=div('','flex:1;min-width:0');
  var title=div('task-title','');title.textContent=t.titulo||'';
  info.appendChild(title);

  var meta=div('task-meta');
  if(showDate){var sd=span('','');sd.textContent=fmtD(t.data);meta.appendChild(sd);}
  if(t.hora){var sh=span('','');sh.textContent=t.hora;meta.appendChild(sh);}
  var sr=span('','');sr.textContent=t.responsavel||'';meta.appendChild(sr);
  if(t.destinatario){var sdt=span('','');sdt.textContent='-> '+t.destinatario;meta.appendChild(sdt);}
  meta.appendChild(mk_badge(t.status,badgeCls(t.status)));
  if(t.recorrente)meta.appendChild(mk_badge('Recorrente','b-blue'));
  if(t.status==='Concluido'&&t.concluido_por){var sc=span('','');sc.textContent='Conc: '+t.concluido_por;meta.appendChild(sc);}
  info.appendChild(meta);
  d.appendChild(info);
  return d;
}

function mkChkSection(day,sec,color) {
  var allItems=checks[sec]||[];
  // Filter items visible on this day
  var items=allItems.map(function(item,i){return {item:item,origIdx:i};}).filter(function(x){
    return itemVisibleOnDay(x.item,day);
  });
  var dcs=checkState[day]||{};
  var st=(dcs[sec])||{};
  // Use origIdx for state
  var done=items.filter(function(x){return st[x.origIdx];}).length;
  var pct=items.length?Math.round(done/items.length*100):0;
  var wrap=div('');

  // Header
  var hd=div('','display:flex;align-items:center;justify-content:space-between;margin-bottom:8px');
  var htitle=span('','font-size:12px;font-weight:700;color:#111827');
  htitle.textContent=(sec==='abertura'?'Abertura':'Encerramento')+' ('+done+'/'+items.length+')';
  hd.appendChild(htitle);
  var addBtn=el('button','','background:none;border:1px solid #D4D9ED;border-radius:5px;width:22px;height:22px;font-size:13px;cursor:pointer;color:#4B5563;display:flex;align-items:center;justify-content:center','+');
  addBtn.onclick=function(){modalOpen('addchk',{sec:sec});};
  hd.appendChild(addBtn);
  wrap.appendChild(hd);

  items.forEach(function(x){
    var item=x.item, origIdx=x.origIdx;
    var row=div('chk-item');
    (function(idx){
      row.onclick=function(){toggleCheck(day,sec,idx);};
      var box=div('chk-box'+(st[idx]?' '+color:''));
      if(st[idx]){var ck=span('','color:#fff;font-size:10px;font-weight:700');ck.textContent='v';box.appendChild(ck);}
      row.appendChild(box);
      var lbl=div('chk-lbl'+(st[idx]?' done':''),'font-size:12px');
      lbl.textContent=typeof item==='string'?item:item.txt;
      row.appendChild(lbl);
      // Day indicator
      if(item.dias){
        var dayPill=span('badge b-blue','font-size:9px');
        var diasNomes=['','Seg','Ter','Qua','Qui','Sex'];
        dayPill.textContent=item.dias.split(',').map(function(d){return diasNomes[d]||d;}).join(',');
        row.appendChild(dayPill);
      }
      // Controls
      var ctrl=div('','display:flex;gap:4px;align-items:center');
      ctrl.onclick=function(e){e.stopPropagation();};
      // Edit button
      var ed=el('button','','background:none;border:none;color:#9CA3AF;cursor:pointer;font-size:12px;padding:2px','✎');
      ed.onclick=function(){modalOpen('addchk',{sec:sec,editIdx:idx});};ctrl.appendChild(ed);
      var rm=el('button','','background:none;border:none;color:#D4D9ED;cursor:pointer;font-size:16px;padding:2px;line-height:1','x');rm.onclick=function(){removeChkItem(sec,idx);};ctrl.appendChild(rm);
      // Drag handle
      var dh=div('','color:#D4D9ED;cursor:grab;font-size:16px;padding:2px;user-select:none;-webkit-user-select:none');dh.textContent='⋮⋮';
      dh.draggable=true;
      dh.ondragstart=function(e){
        e.stopPropagation();
        e.dataTransfer.effectAllowed='move';
        e.dataTransfer.setData('chk-sec',sec);
        e.dataTransfer.setData('chk-idx',String(idx));
        row.style.opacity='0.5';
      };
      dh.ondragend=function(){row.style.opacity='1';};
      ctrl.appendChild(dh);
      row.appendChild(ctrl);
      // Drop zone on row
      row.ondragover=function(e){
        if(e.dataTransfer.getData('chk-sec')===sec||true){e.preventDefault();row.style.borderTop='2px solid #002B7F';}
      };
      row.ondragleave=function(){row.style.borderTop='';};
      row.ondrop=function(e){
        e.preventDefault();row.style.borderTop='';
        var fromSec=e.dataTransfer.getData('chk-sec');
        var fromIdx=parseInt(e.dataTransfer.getData('chk-idx'));
        if(fromSec!==sec||isNaN(fromIdx)||fromIdx===idx)return;
        var arr=checks[sec];
        var item2=arr.splice(fromIdx,1)[0];
        var toIdx=idx>fromIdx?idx-1:idx;
        arr.splice(toIdx,0,item2);
        saveChecks();renderPage();
      };
    })(origIdx);
    wrap.appendChild(row);
  });

  if(!items.length){
    var emp=div('','font-size:12px;color:#9CA3AF;text-align:center;padding:8px 0');
    emp.textContent='Sem itens para este dia';
    wrap.appendChild(emp);
  }

  var prog=div('progress');
  var fill=div('prog-fill','width:'+pct+'%;background:'+(color==='green'?'#1A7A4A':'#002B7F'));
  prog.appendChild(fill);wrap.appendChild(prog);
  return wrap;
}

    todayCard.appendChild(thd);
    var tb=div('week-body');
    var ta=div('week-add');ta.textContent='+ Adicionar tarefa para hoje';ta.onclick=function(){modalOpen('task',{task:null,date:td});};tb.appendChild(ta);
    todayCard.appendChild(tb);
    page.appendChild(todayCard);
  }

  // Other days
  var wrap=div('week-wrap');
  var grid=div('week-grid');
  dates.forEach(function(d){
    if(d.toISOString().slice(0,10)===td)return;
    grid.appendChild(mkWeekCol(d,'normal'));
  });
  wrap.appendChild(grid);page.appendChild(wrap);
  return page;
}

function buildIA() {
  var page=div('page');
  var title=div('sec-title');title.textContent='Assistente IA';page.appendChild(title);

  // Chat card
  var chatCard=div('card');
  var chatHead=div('','background:#002B7F;padding:12px 14px;display:flex;align-items:center;gap:8px;border-radius:12px 12px 0 0');
  var avatar=div('','width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:14px');avatar.textContent='IA';
  chatHead.appendChild(avatar);
  var chatInfo=div('');
  var ct=div('','color:#fff;font-size:13px;font-weight:700');ct.textContent='Assistente NAC';chatInfo.appendChild(ct);
  var cs=div('','color:rgba(255,255,255,.55);font-size:10px');cs.textContent='Dados em tempo real - Supabase';chatInfo.appendChild(cs);
  chatHead.appendChild(chatInfo);chatCard.appendChild(chatHead);

  var msgs=div('ai-msgs');msgs.id='ia-msgs-el';
  iaHist.forEach(function(m){
    var d=div('ai-msg '+(m.r==='user'?'user':'bot'));d.innerHTML=esc(m.t).replace(/\n/g,'<br>');msgs.appendChild(d);
  });
  if(iaBusy){var th=div('ai-msg thinking');th.textContent='Analisando...';msgs.appendChild(th);}
  chatCard.appendChild(msgs);

  var inputRow=div('ai-row');
  var inp=el('textarea','ai-inp','');inp.id='ai-inp-el';inp.placeholder='Pergunte sobre o NAC...';inp.rows=1;
  inp.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();var v=this.value;this.value='';sendIA(v);}};
  inputRow.appendChild(inp);
  var sendB=btn('ai-send','->',function(){var v=document.getElementById('ai-inp-el').value;document.getElementById('ai-inp-el').value='';sendIA(v);});
  if(iaBusy)sendB.disabled=true;
  inputRow.appendChild(sendB);
  chatCard.appendChild(inputRow);
  page.appendChild(chatCard);

  // Quick actions
  var qCard=div('card');
  var qH=div('card-head');qH.appendChild(span('card-title','Acoes rapidas'));qCard.appendChild(qH);
  var qB=div('card-body');
  [['Briefing do dia','Faca um briefing do dia com prioridades, riscos e recomendacoes.'],
   ['Analise de riscos','Analise a semana e identifique riscos e prioridades.'],
   ['Tarefas em atraso','Quais tarefas estao atrasadas? Liste com prioridade.'],
   ['Foco agora','Quais as 3 coisas mais importantes para focar agora?'],
   ['Priorizar melhorias','Analise as melhorias e sugira por onde comecar.'],
   ['Resumo da semana','Resuma a semana: concluido e pendente.']
  ].forEach(function(qa){
    var qb=btn('qbtn',qa[0],function(){sendIA(qa[1]);});qB.appendChild(qb);
  });
  qCard.appendChild(qB);page.appendChild(qCard);

  setTimeout(function(){var el2=document.getElementById('ia-msgs-el');if(el2)el2.scrollTop=el2.scrollHeight;},50);
  return page;
}

function buildMelhorias() {
  var page=div('page');
  var hd=div('sec-row');
  var ht=div('sec-title');ht.textContent='Melhorias';hd.appendChild(ht);
  hd.appendChild(btn('btn','+Nova melhoria',function(){modalOpen('mel',{mel:null});}));
  page.appendChild(hd);

  var total=mels.length,emA=mels.filter(function(m){return m.status==='Em execucao';}).length;
  var conc=mels.filter(function(m){return m.status==='Concluido';}).length;
  var alta=mels.filter(function(m){return m.prioridade==='Alta'&&m.status!=='Concluido';}).length;
  var kpiGrid=div('kpi-grid');
  [[total,'Total',''],[emA,'Em execucao','kamber'],[conc,'Concluidas','kgreen'],[alta,'Alta prioridade','kred']].forEach(function(k){
    var kpi=div('kpi '+(k[2]||''));
    var kn=div('kpi-n','');kn.textContent=k[0];kpi.appendChild(kn);
    var kl=div('kpi-l','');kl.textContent=k[1];kpi.appendChild(kl);
    kpiGrid.appendChild(kpi);
  });
  page.appendChild(kpiGrid);

  var sorted=mels.slice().sort(function(a,b){var po={Alta:0,Media:1,Baixa:2};return(po[a.prioridade]||1)-(po[b.prioridade]||1);});
  if(!sorted.length){var emp=div('card');var eb=div('card-body');var et=div('empty');et.textContent='Nenhuma melhoria registrada.';eb.appendChild(et);emp.appendChild(eb);page.appendChild(emp);}
  sorted.forEach(function(m){
    var card=div('card','cursor:pointer');
    card.onclick=function(){var found=mels.find(function(x){return x.id===m.id;});modalOpen('mel',{mel:found||m});};
    var cb=div('','padding:14px 16px');
    var row1=div('','display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap');
    row1.appendChild(mk_pdot(pdotColor(m.prioridade)));
    var prob=span('','font-size:13px;font-weight:700;color:#111827;flex:1');prob.textContent=(m.problema||'').slice(0,80)+((m.problema||'').length>80?'...':'');row1.appendChild(prob);
    cb.appendChild(row1);
    var row2=div('','display:flex;gap:6px;flex-wrap:wrap;align-items:center');
    row2.appendChild(mk_badge(m.prioridade,badgeCls(m.prioridade)));
    row2.appendChild(mk_badge(m.status,badgeCls(m.status)));
    var resp=span('','font-size:11px;color:#9CA3AF');resp.textContent=m.responsavel||'';row2.appendChild(resp);
    if(m.setor){var set=span('','font-size:11px;color:#9CA3AF');set.textContent='Setor: '+m.setor;row2.appendChild(set);}
    if(m.prazo){var pr=span('','font-size:11px;color:#9CA3AF');pr.textContent=fmtD(m.prazo);row2.appendChild(pr);}
    cb.appendChild(row2);
    if(m.sugestao){var sug=div('','font-size:12px;color:#4B5563;line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px solid #E8EBF5');sug.textContent=m.sugestao;cb.appendChild(sug);}
    card.appendChild(cb);page.appendChild(card);
  });
  return page;
}

// ══════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════
var NAV = [{id:'dashboard',icon:'D',label:'Dashboard'},{id:'rotina',icon:'R',label:'Rotina'},{id:'semana',icon:'S',label:'Semana'},{id:'ia',icon:'IA',label:'IA'},{id:'melhorias',icon:'M',label:'Melhorias'}];

function buildSB(container) {
  var brand=div('sb-brand');
  var logo=div('sb-logo');logo.textContent='NAC';brand.appendChild(logo);
  var sub=div('sb-sub');sub.textContent='Centro de Comando';brand.appendChild(sub);
  container.appendChild(brand);
  var nav=div('sb-nav');
  NAV.forEach(function(n){
    var b=btn('sb-btn'+(tab===n.id?' active':''),n.label,function(){tab=n.id;closeMobileSB();renderPage();});
    nav.appendChild(b);
  });
  container.appendChild(nav);
  var foot=div('sb-footer');
  var user=div('','display:flex;align-items:center;gap:8px;padding:8px 10px');
  var av=div('','width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0');av.textContent='N';user.appendChild(av);
  var ui=div('');
  var un=div('','font-size:12px;color:rgba(255,255,255,.75);font-weight:500');un.textContent='NAC Marista';ui.appendChild(un);
  var us=div('','font-size:10px;color:rgba(255,255,255,.4)');us.textContent=syncOk?'Sincronizado':'Erro de conexao';ui.appendChild(us);
  user.appendChild(ui);foot.appendChild(user);container.appendChild(foot);
}

function closeMobileSB() {
  var ov=document.getElementById('sb-ov');if(ov)ov.classList.remove('open');
}

function renderPage() {
  var now=new Date();
  var dtStr=now.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})+' - '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  var shell=document.getElementById('shell');
  shell.innerHTML='';

  // Desktop sidebar
  var sb=div('sidebar');buildSB(sb);shell.appendChild(sb);

  // Main
  var main=div('main');

  // Topbar
  var topbar=div('topbar');
  var menuB=btn('menu-btn','Menu',function(){
    var ov=document.getElementById('sb-ov');if(ov)ov.classList.add('open');
  });
  topbar.appendChild(menuB);
  var appName=span('','font-family:Montserrat,sans-serif;font-size:15px;font-weight:800;color:#002B7F');appName.textContent='NAC';topbar.appendChild(appName);
  var right=div('','margin-left:auto;display:flex;align-items:center;gap:10px');
  var syncDot=div('','width:7px;height:7px;border-radius:50%;background:'+(syncOk?'#1A7A4A':'#D62828'));right.appendChild(syncDot);
  var dtEl=span('','font-size:11px;color:#9CA3AF');dtEl.textContent=dtStr;right.appendChild(dtEl);
  topbar.appendChild(right);main.appendChild(topbar);

  // Content
  var content=div('content');
  var page;
  if(tab==='dashboard')page=buildDashboard();
  else if(tab==='rotina')page=buildRotina();
  else if(tab==='semana')page=buildSemana();
  else if(tab==='ia')page=buildIA();
  else if(tab==='melhorias')page=buildMelhorias();
  if(page)content.appendChild(page);
  main.appendChild(content);

  // Bottom nav
  var bottomNav=div('bottom-nav');
  NAV.forEach(function(n){
    var b=btn('nav-btn'+(tab===n.id?' active':''),null,function(){tab=n.id;renderPage();});
    var icon=span('','font-size:20px;line-height:1');icon.textContent=n.icon;b.appendChild(icon);
    var label=span('nav-label','');label.textContent=n.label;b.appendChild(label);
    if(tab===n.id){var bar=div('nav-bar');b.appendChild(bar);}
    bottomNav.appendChild(b);
  });
  main.appendChild(bottomNav);
  shell.appendChild(main);

  // Mobile sidebar overlay
  var sbOv=div('sb-ov');sbOv.id='sb-ov';
  var sbBg=div('sb-bg');sbBg.onclick=function(){sbOv.classList.remove('open');};sbOv.appendChild(sbBg);
  var sbM=div('sb-mobile');buildSB(sbM);sbOv.appendChild(sbM);
  shell.appendChild(sbOv);
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
document.getElementById('modal-close-btn').onclick = modalClose;
document.getElementById('the-modal').onclick = function(e){if(e.target===this)modalClose();};

renderPage();
loadAll();
setInterval(function(){
  if(!document.getElementById('the-modal').classList.contains('open'))loadAll();
}, 30000);
</script>
